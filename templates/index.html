{% extends 'base.html' %}

{% block title %}Головне меню{% endblock %}

{% block content %}
<div class="container my-4">
    <h2 class="text-center mb-4" style="color: #8b0000;">Наше меню</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for dish in dishes %}
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="{{ url_for('static', filename='uploads/' + dish.image) }}" class="card-img-top" alt="{{ dish.title }}" style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ dish.title }}</h5>
                        <p class="badge bg-secondary w-auto align-self-start">{{ dish.category }}</p>
                        <p class="card-text text-muted flex-grow-1">{{ dish.description }}</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <span class="fw-bold fs-5" style="color: #8b0000;">{{ dish.price }} грн</span>
                            <div class="d-flex gap-2">
                                <a href="{{ url_for('position', dish_id=dish.id) }}" class="btn btn-sm btn-outline-primary">Детальніше</a>
                                <form action="{{ url_for('add_to_cart', dish_id=dish.id) }}" method="POST" style="margin:0;">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <button type="submit" class="btn btn-sm btn-success">У кошик</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
