{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h2>Редагувати страву: {{ dish.title }}</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div style="margin-bottom: 1rem;">
            <label>Назва:</label><br>
            <input type="text" name="title" value="{{ dish.title }}" required class="form-control mt-1">
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Категорія:</label><br>
            <select name="category_id" required class="form-select mt-1">
                {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if dish.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Ціна (грн):</label><br>
            <input type="number" step="0.01" name="price" value="{{ dish.price }}" required class="form-control mt-1">
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Короткий опис:</label><br>
            <textarea name="description" class="form-control mt-1" rows="2">{{ dish.description }}</textarea>
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Повний опис:</label><br>
            <textarea name="full_description" class="form-control mt-1" rows="4">{{ dish.full_description }}</textarea>
        </div>
        <div style="margin-bottom: 1rem;">
            <label>Поточна фотографія:</label><br>
            <img src="{{ url_for('static', filename='uploads/' + dish.image) }}" width="80" style="object-fit: cover; margin-top: 0.5rem; border-radius: 5px;"><br><br>
            <label>Змінити фото (необов'язково):</label><br>
            <input type="file" name="image" accept="image/*" class="form-control mt-1">
        </div>
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success" style="background-color: #8b0000; border: none;">Зберегти зміни</button>
            <a href="/admin" class="btn btn-secondary">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
